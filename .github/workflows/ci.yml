name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Release artifacts must be reproducible by independent maintainers.
      # Building twice and diffing hashes proves the toolchain is
      # deterministic; .gitattributes (eol=lf) keeps source bytes identical
      # across platforms so this holds beyond CI too.
      - name: reproducible build (twice, byte-identical)
        run: |
          npm run build
          find dist -type f | sort | xargs sha256sum > /tmp/build1.sum
          npm run build
          find dist -type f | sort | xargs sha256sum > /tmp/build2.sum
          diff /tmp/build1.sum /tmp/build2.sum

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  calibration-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r tools/requirements.txt

      - name: install precision-fixture runtime
        run: pip install onnx==1.18.0 onnxruntime==1.22.0

      # Synthetic-data end-to-end: fit, shift, and verify the 0.65 boundary
      # placement plus monotonicity of the emitted knot table.
      - name: calibration fitting smoke test
        run: python tools/test_fit_calibration_smoke.py

      - name: hash-bound evaluation integration test
        run: python tools/test_evaluation_contract.py

      - name: data and leakage-audit integration test
        run: python tools/test_data_tools_smoke.py

      - name: nuisance-null and clustered-CI smoke test
        run: python tools/test_explain_it_away_smoke.py

      - name: compile precision runner
        run: python -m py_compile tools/compare_int8_fp32.py

      - name: adversarial evidence fixture suite
        run: python -E tools/test_adversarial_fixtures.py
